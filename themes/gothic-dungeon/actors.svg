<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Hooded cultists on a 24x32 grid (33x44 in the room), flat shaded with no outline.
       c1 is the robe, c2 its shaded side and c3 the glow of the eyes, from "species.colors". -->
  <symbol id="gd-body" viewBox="0 0 24 32">
    <ellipse cx="12" cy="30" rx="9" ry="2.2" fill="#000000" opacity="0.55"/>
    <path d="M4 29 L8 13 Q12 9 16 13 L20 29 Q12 32 4 29 Z" fill="var(--c1)"/>
    <path d="M12 10 Q16 11 16 13 L20 29 Q16 31 12 31 Z" fill="var(--c2)"/>
    <rect x="7" y="19" width="10" height="1.5" fill="#B8923A"/>
    <path d="M6 12 Q6 2 12 2 Q18 2 18 12 Q12 15 6 12 Z" fill="var(--c1)" stroke="#000000" stroke-opacity="0.35" stroke-width="0.5"/>
    <path d="M12 2 Q18 2 18 12 Q15 13.5 12 13.5 Z" fill="var(--c2)"/>
    <path d="M7.6 6 Q8.6 3.4 11 3" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.8" stroke-linecap="round"/>
    <ellipse cx="12" cy="9" rx="4" ry="4" fill="#0A0606"/>
  </symbol>
  <symbol id="gd-idle" viewBox="0 0 24 32">
    <use href="#gd-body"/>
    <circle cx="10.3" cy="9" r="1" fill="var(--c3)"/><circle cx="13.7" cy="9" r="1" fill="var(--c3)"/>
    <circle cx="6.5" cy="20.5" r="1.6" fill="#C9A27A"/><circle cx="17.5" cy="20.5" r="1.6" fill="#B08A64"/>
  </symbol>
  <symbol id="gd-work" viewBox="0 0 24 32">
    <use href="#gd-body"/>
    <circle cx="10.3" cy="9.6" r="1" fill="var(--c3)"/><circle cx="13.7" cy="9.6" r="1" fill="var(--c3)"/>
    <path d="M8 14 L3.4 13.6 L4.4 17.4 L8.6 17.6 Z" fill="var(--c1)"/><path d="M16 14 L20.6 14.6 L19.6 18.4 L15.4 17.6 Z" fill="var(--c2)"/>
    <line x1="4" y1="15.6" x2="1.6" y2="8.6" stroke="#E8DCB8" stroke-width="1" stroke-linecap="round"/>
    <path d="M1.6 8.6 L0.6 11 L2.8 10.6 Z" fill="#E8DCB8"/>
    <circle cx="4" cy="15.6" r="1.6" fill="#C9A27A"/><circle cx="20" cy="16.6" r="1.6" fill="#B08A64"/>
    <circle cx="20" cy="13.2" r="1.1" fill="var(--c3)" opacity="0.85"/><circle cx="21.6" cy="11" r="0.6" fill="var(--c3)" opacity="0.6"/>
  </symbol>
  <symbol id="gd-read" viewBox="0 0 24 32">
    <use href="#gd-body"/>
    <circle cx="10.4" cy="10.4" r="0.75" fill="var(--c3)"/><circle cx="13.6" cy="10.4" r="0.75" fill="var(--c3)"/>
    <rect x="6.6" y="15.6" width="10.8" height="6.4" fill="#4A2A1A"/>
    <rect x="7.4" y="16.2" width="9.2" height="5" fill="#D9C89A"/><line x1="12" y1="16.2" x2="12" y2="21.2" stroke="#6A5236" stroke-width="0.8"/>
    <line x1="8.4" y1="17.8" x2="10.8" y2="17.8" stroke="#6A5236" stroke-width="0.5"/><line x1="8.4" y1="19.4" x2="10.8" y2="19.4" stroke="#6A5236" stroke-width="0.5"/>
    <line x1="13.2" y1="17.8" x2="15.6" y2="17.8" stroke="#6A5236" stroke-width="0.5"/><line x1="13.2" y1="19.4" x2="15.6" y2="19.4" stroke="#6A5236" stroke-width="0.5"/>
    <circle cx="6.6" cy="20.6" r="1.5" fill="#C9A27A"/><circle cx="17.4" cy="20.6" r="1.5" fill="#B08A64"/>
  </symbol>
  <symbol id="gd-wait" viewBox="0 0 24 32">
    <use href="#gd-body"/>
    <circle cx="10.3" cy="8.6" r="1.25" fill="var(--c3)"/><circle cx="13.7" cy="8.6" r="1.25" fill="var(--c3)"/>
    <path d="M8 13.4 L2.2 8.4 L4.4 6.8 L9.6 12 Z" fill="var(--c1)"/>
    <circle cx="3" cy="7" r="1.7" fill="#C9A27A"/>
    <circle cx="17.5" cy="20.5" r="1.6" fill="#B08A64"/>
  </symbol>
  <symbol id="gd-blocked" viewBox="0 0 24 32">
    <use href="#gd-body"/>
    <path d="M8.8 8 L11.4 9.4 L11.2 10.2 L8.8 9.4 Z" fill="var(--c3)"/><path d="M15.2 8 L12.6 9.4 L12.8 10.2 L15.2 9.4 Z" fill="var(--c3)"/>
    <path d="M7 15 L17 17.4 L17 19 L7 16.8 Z" fill="var(--c1)"/><path d="M17 15 L7 17.4 L7 19 L17 16.8 Z" fill="var(--c2)"/>
    <circle cx="7.2" cy="18.2" r="1.4" fill="#C9A27A"/><circle cx="16.8" cy="18.2" r="1.4" fill="#B08A64"/>
  </symbol>
  <symbol id="gd-sleep" viewBox="0 0 24 32">
    <!-- Same hood position as the other poses, eyes shut and hands folded, so outfits line up. -->
    <use href="#gd-body"/>
    <path d="M9.2 9.6 Q10.3 10.6 11.4 9.6" fill="none" stroke="var(--c3)" stroke-opacity="0.7" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M12.6 9.6 Q13.7 10.6 14.8 9.6" fill="none" stroke="var(--c3)" stroke-opacity="0.7" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M8 14.4 L11.4 21 L12.6 21 L16 14.4 L14.4 14 L12 18.6 L9.6 14 Z" fill="var(--c2)"/>
    <circle cx="11.2" cy="21.4" r="1.4" fill="#C9A27A"/><circle cx="12.8" cy="21.4" r="1.4" fill="#B08A64"/>
  </symbol>
  <!-- Parts: what tells each species apart, drawn on top of the pose. -->
  <symbol id="gd-horns" viewBox="0 0 24 32">
    <path d="M7.4 5.6 Q4.4 4 4.8 0.6 Q7.4 1.8 9.2 3.6 Z" fill="#D9C89A"/><path d="M16.6 5.6 Q19.6 4 19.2 0.6 Q16.6 1.8 14.8 3.6 Z" fill="#B0A078"/>
  </symbol>
  <symbol id="gd-staff" viewBox="0 0 24 32">
    <line x1="22.2" y1="6" x2="22.2" y2="30" stroke="#6A5236" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="22.2" cy="4.4" r="3.4" fill="var(--c3)" opacity="0.25"/><circle cx="22.2" cy="4.4" r="1.8" fill="var(--c3)"/>
  </symbol>
  <!-- Outfits: one set is picked per agent. o1 comes from "outfitColors". -->
  <symbol id="gd-out-sash" viewBox="0 0 24 32">
    <path d="M7.6 14.4 L9.6 13 L17.8 24.6 L17.2 27 Z" fill="var(--o1)"/>
  </symbol>
  <symbol id="gd-out-amulet" viewBox="0 0 24 32">
    <path d="M9 13.6 Q12 17.8 15 13.6" fill="none" stroke="#B8923A" stroke-width="0.6"/>
    <path d="M12 15 L13.4 16.6 L12 18.2 L10.6 16.6 Z" fill="var(--o1)" stroke="#B8923A" stroke-width="0.4"/>
  </symbol>
  <symbol id="gd-out-trim" viewBox="0 0 24 32">
    <ellipse cx="12" cy="9" rx="4.5" ry="4.5" fill="none" stroke="var(--o1)" stroke-width="1"/>
  </symbol>
  <symbol id="gd-out-mantle" viewBox="0 0 24 32">
    <path d="M6.8 12.4 Q12 15.4 17.2 12.4 L18.4 15.4 Q12 18 5.6 15.4 Z" fill="var(--o1)"/>
    <circle cx="12" cy="14.8" r="0.9" fill="#B8923A"/>
  </symbol>
  <symbol id="gd-out-hem" viewBox="0 0 24 32">
    <path d="M4.5 26.6 Q12 29.8 19.5 26.6 L20 29 Q12 32 4 29 Z" fill="var(--o1)"/>
  </symbol>
  <!-- Emotes: short moves the plugin plays now and then, listed in "actors.emotes". A pose
       here stands in for the usual one while its emote plays; an effect is laid over the
       character and may reach outside the grid. Effects glow in c3, like the eyes. -->
  <!-- Both sleeves raised, hands alight: casting. -->
  <symbol id="gd-cast" viewBox="0 0 24 32">
    <use href="#gd-body"/>
    <circle cx="10.3" cy="8.6" r="1.25" fill="var(--c3)"/><circle cx="13.7" cy="8.6" r="1.25" fill="var(--c3)"/>
    <path d="M8 13.4 L2.2 8.4 L4.4 6.8 L9.6 12 Z" fill="var(--c1)"/><path d="M16 13.4 L21.8 8.4 L19.6 6.8 L14.4 12 Z" fill="var(--c2)"/>
    <circle cx="3" cy="7" r="3" fill="var(--c3)" opacity="0.3"/><circle cx="21" cy="7" r="3" fill="var(--c3)" opacity="0.3"/>
    <circle cx="3" cy="7" r="1.7" fill="#C9A27A"/><circle cx="21" cy="7" r="1.7" fill="#B08A64"/>
  </symbol>
  <!-- Sparks arcing from hand to hand over the hood. -->
  <symbol id="gd-fx-sparks" viewBox="0 0 24 32" overflow="visible">
    <path d="M-0.5 0.5 L0.1 1.9 L1.5 2.5 L0.1 3.1 L-0.5 4.5 L-1.1 3.1 L-2.5 2.5 L-1.1 1.9 Z" fill="var(--c3)"/>
    <path d="M5 -3.1 L5.45 -2.05 L6.5 -1.6 L5.45 -1.15 L5 -0.1 L4.55 -1.15 L3.5 -1.6 L4.55 -2.05 Z" fill="var(--c3)" opacity="0.85"/>
    <path d="M12 -5.4 L12.66 -3.86 L14.2 -3.2 L12.66 -2.54 L12 -1 L11.34 -2.54 L9.8 -3.2 L11.34 -3.86 Z" fill="var(--c3)"/>
    <path d="M19 -3.1 L19.45 -2.05 L20.5 -1.6 L19.45 -1.15 L19 -0.1 L18.55 -1.15 L17.5 -1.6 L18.55 -2.05 Z" fill="var(--c3)" opacity="0.85"/>
    <path d="M24.5 0.5 L25.1 1.9 L26.5 2.5 L25.1 3.1 L24.5 4.5 L23.9 3.1 L22.5 2.5 L23.9 1.9 Z" fill="var(--c3)"/>
    <circle cx="12" cy="-3.2" r="0.7" fill="#FFFFFF"/><circle cx="-0.5" cy="2.5" r="0.6" fill="#FFFFFF"/><circle cx="24.5" cy="2.5" r="0.6" fill="#FFFFFF"/>
  </symbol>
  <!-- A circle of light on the flagstones, for a rite that is complete. -->
  <symbol id="gd-fx-circle" viewBox="0 0 24 32" overflow="visible">
    <ellipse cx="12" cy="30" rx="13" ry="3.4" fill="var(--c3)" opacity="0.14"/>
    <ellipse cx="12" cy="30" rx="13" ry="3.4" fill="none" stroke="var(--c3)" stroke-width="0.7"/>
    <ellipse cx="12" cy="30" rx="9.6" ry="2.3" fill="none" stroke="var(--c3)" stroke-width="0.4" stroke-dasharray="1.2 1.2"/>
    <path d="M-2.5 22.6 L-2.08 23.58 L-1.1 24 L-2.08 24.42 L-2.5 25.4 L-2.92 24.42 L-3.9 24 L-2.92 23.58 Z" fill="var(--c3)"/><path d="M26.5 20.8 L26.86 21.64 L27.7 22 L26.86 22.36 L26.5 23.2 L26.14 22.36 L25.3 22 L26.14 21.64 Z" fill="var(--c3)"/><path d="M-1 16.1 L-0.73 16.73 L-0.1 17 L-0.73 17.27 L-1 17.9 L-1.27 17.27 L-1.9 17 L-1.27 16.73 Z" fill="var(--c3)" opacity="0.8"/>
  </symbol>
  <!-- A small flame that kindles beside the hood: a thought. -->
  <symbol id="gd-fx-wisp" viewBox="0 0 24 32" overflow="visible">
    <ellipse cx="1.5" cy="3.4" rx="3.6" ry="4" fill="var(--c3)" opacity="0.2"/>
    <path d="M1.5 -1.4 Q3.8 1.6 3.4 3.8 Q3 6 1.5 6 Q0 6 -0.4 3.8 Q-0.7 2 0.4 0.8 Q1.2 0 1.5 -1.4 Z" fill="var(--c3)"/>
    <path d="M1.5 2.6 Q2.5 4 2.1 5 Q1.8 5.6 1.5 5.6 Q1 5.6 0.8 5 Q0.6 3.8 1.5 2.6 Z" fill="#FFFFFF" opacity="0.85"/>
  </symbol>
  <!-- Black smoke and embers: a curse muttered. -->
  <symbol id="gd-fx-smoke" viewBox="0 0 24 32" overflow="visible">
    <g fill="#1A1212" opacity="0.85"><circle cx="2" cy="4.6" r="2.6"/><circle cx="-1" cy="1.6" r="2"/><circle cx="2.6" cy="-0.6" r="1.4"/></g>
    <circle cx="-2.6" cy="5.4" r="0.6" fill="#E8553A"/><circle cx="4.6" cy="1.4" r="0.5" fill="#E8553A"/><circle cx="0.4" cy="-2" r="0.45" fill="#FFD24A"/>
  </symbol>
  <!-- Familiar: a floating wisp, one per subagent. The flame is the parent's robe and the core
       glows like its eyes. -->
  <symbol id="gd-familiar" viewBox="0 0 14 16">
    <ellipse cx="7" cy="9.4" rx="6.6" ry="6.4" fill="var(--c3)" opacity="0.16"/>
    <path d="M7 1 Q9.5 4 10.6 6.6 Q12 10 9.8 12.6 Q8.4 14.2 7 14.2 Q5.6 14.2 4.2 12.6 Q2 10 3.6 7 Q4.6 5.6 4.6 4 Q6.4 4.6 7 1 Z" fill="var(--c1)"/>
    <path d="M7 1 Q9.5 4 10.6 6.6 Q12 10 9.8 12.6 Q8.4 14.2 7 14.2 Z" fill="var(--c2)"/>
    <path d="M7 5.6 Q9.6 8.2 9 10.8 Q8.4 12.8 7 12.8 Q5.6 12.8 5 10.8 Q4.4 8.4 7 5.6 Z" fill="var(--c3)"/>
    <ellipse cx="6" cy="10" rx="0.6" ry="0.9" fill="#0A0606"/><ellipse cx="8" cy="10" rx="0.6" ry="0.9" fill="#0A0606"/>
  </symbol>
</svg>
