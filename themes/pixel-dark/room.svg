<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 464 290" shape-rendering="crispEdges">
  <!-- An original developer office at night. Along the wall: a server rack, a kanban board, a
       window, a build dashboard, a clock and the door. On the floor: two rows of desks with
       monitors, a bookshelf, a sofa, a coffee corner and a meeting table. No readable text,
       so rooms may be mirrored. -->
  <defs>
    <pattern id="pd-floor" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect width="56" height="56" fill="#1E2534"/><rect width="28" height="28" fill="#232B3C"/><rect x="28" y="28" width="28" height="28" fill="#232B3C"/>
    </pattern>
    <symbol id="pd-desk" viewBox="0 0 24 14"><rect x="7" width="10" height="7" fill="#1A2133"/><rect x="11" y="7" width="2" height="1" fill="#1A2133"/><rect y="8" width="24" height="2" fill="#B5764A"/><rect y="8" width="24" height="1" fill="#D08C5C"/><rect x="1" y="10" width="2" height="4" fill="#7A4E30"/><rect x="21" y="10" width="2" height="4" fill="#7A4E30"/><rect x="18" y="7" width="2" height="1" fill="#E8EAF0"/><rect x="3" y="7" width="3" height="1" fill="#4A5568"/></symbol>
    <symbol id="pd-plant" viewBox="0 0 8 14"><rect x="3" width="2" height="3" fill="#4FB286"/><rect x="1" y="2" width="6" height="5" fill="#4FB286"/><rect y="4" width="2" height="2" fill="#3A8E69"/><rect x="6" y="3" width="2" height="2" fill="#3A8E69"/><rect x="2" y="8" width="4" height="6" fill="#B5764A"/><rect x="1" y="8" width="6" height="1" fill="#D08C5C"/></symbol>
  </defs>
  <rect width="464" height="290" fill="url(#pd-floor)"/>
  <rect width="464" height="52" fill="#33405F"/><rect y="52" width="464" height="4" fill="#1A2133"/>

  <!-- server rack -->
  <svg x="14" y="14" width="48" height="90" viewBox="0 0 16 30"><rect width="16" height="30" fill="#0B0E13"/><rect x="1" y="1" width="14" height="27" fill="#1A2133"/>
    <g fill="#2F3848"><rect x="2" y="2" width="12" height="4"/><rect x="2" y="7" width="12" height="4"/><rect x="2" y="12" width="12" height="4"/><rect x="2" y="17" width="12" height="4"/><rect x="2" y="22" width="12" height="4"/></g>
    <g fill="#0B0E13"><rect x="8" y="3" width="5" height="1"/><rect x="8" y="8" width="5" height="1"/><rect x="8" y="13" width="5" height="1"/><rect x="8" y="18" width="5" height="1"/><rect x="8" y="23" width="5" height="1"/><rect x="8" y="24" width="5" height="1"/><rect x="8" y="9" width="5" height="1"/></g>
    <g fill="#6FE0D2"><rect x="3" y="3" width="1" height="1"/><rect x="3" y="8" width="1" height="1"/><rect x="5" y="8" width="1" height="1"/><rect x="3" y="18" width="1" height="1"/><rect x="3" y="23" width="1" height="1"/><rect x="5" y="23" width="1" height="1"/></g>
    <rect x="5" y="3" width="1" height="1" fill="#F8B366"/><rect x="3" y="13" width="1" height="1" fill="#FF9A9A"/><rect x="5" y="18" width="1" height="1" fill="#F8B366"/><rect x="3" y="4" width="3" height="1" fill="#4A5568"/><rect x="3" y="14" width="3" height="1" fill="#4A5568"/>
  </svg>

  <!-- kanban board with a marker tray -->
  <rect x="86" y="8" width="120" height="38" fill="#1A2133"/><rect x="88" y="10" width="116" height="34" fill="#C3C9D4"/><rect x="88" y="10" width="116" height="2" fill="#E8EAF0"/>
  <rect x="126" y="13" width="1" height="29" fill="#7C8798"/><rect x="165" y="13" width="1" height="29" fill="#7C8798"/>
  <rect x="92" y="14" width="18" height="2" fill="#4A5568"/><rect x="131" y="14" width="22" height="2" fill="#4A5568"/><rect x="170" y="14" width="14" height="2" fill="#4A5568"/>
  <rect x="92" y="19" width="30" height="6" fill="#F8B366"/><rect x="92" y="27" width="30" height="6" fill="#FF9A9A"/><rect x="92" y="35" width="30" height="6" fill="#F8B366"/>
  <rect x="131" y="19" width="30" height="6" fill="#6FE0D2"/><rect x="131" y="27" width="30" height="6" fill="#C9A6FF"/>
  <rect x="170" y="19" width="30" height="6" fill="#9BE08A"/><rect x="170" y="27" width="30" height="6" fill="#9BE08A"/><rect x="170" y="35" width="30" height="6" fill="#6FE0D2"/>
  <g fill="#1A2133" opacity="0.45"><rect x="94" y="21" width="14" height="1"/><rect x="94" y="29" width="18" height="1"/><rect x="94" y="37" width="10" height="1"/><rect x="133" y="21" width="16" height="1"/><rect x="133" y="29" width="12" height="1"/><rect x="172" y="21" width="12" height="1"/><rect x="172" y="29" width="18" height="1"/><rect x="172" y="37" width="14" height="1"/></g>
  <rect x="120" y="46" width="52" height="3" fill="#9AA3B2"/><rect x="126" y="45" width="8" height="2" fill="#FF9A9A"/><rect x="138" y="45" width="8" height="2" fill="#6FE0D2"/><rect x="156" y="45" width="10" height="2" fill="#E8EAF0"/>

  <!-- window -->
  <svg x="220" y="10" width="42" height="30" viewBox="0 0 14 10"><rect width="14" height="10" fill="#1A2133"/><rect x="1" y="1" width="5" height="8" fill="#7FB2FF"/><rect x="8" y="1" width="5" height="8" fill="#7FB2FF"/><rect x="2" y="2" width="2" height="2" fill="#C9DEFF"/><rect x="9" y="2" width="2" height="2" fill="#C9DEFF"/><rect x="1" y="6" width="2" height="3" fill="#4F86D9"/><rect x="4" y="7" width="2" height="2" fill="#4F86D9"/><rect x="8" y="7" width="3" height="2" fill="#4F86D9"/><rect x="11" y="5" width="2" height="4" fill="#4F86D9"/></svg>

  <!-- build dashboard -->
  <svg x="282" y="6" width="72" height="39" viewBox="0 0 24 13"><rect x="1" width="22" height="13" fill="#1A2133"/><rect x="2" y="1" width="20" height="11" fill="#0B0E13"/><rect x="3" y="7" width="2" height="4" fill="#6FE0D2"/><rect x="6" y="5" width="2" height="6" fill="#6FE0D2"/><rect x="9" y="8" width="2" height="3" fill="#F8B366"/><rect x="12" y="4" width="2" height="7" fill="#6FE0D2"/><rect x="3" y="2" width="8" height="1" fill="#7C8798"/><rect x="16" y="2" width="5" height="1" fill="#C3C9D4"/><rect x="16" y="4" width="4" height="1" fill="#7C8798"/><rect x="16" y="7" width="2" height="2" fill="#FF9A9A"/><rect x="19" y="7" width="2" height="2" fill="#9BE08A"/><rect x="16" y="10" width="5" height="1" fill="#7C8798"/></svg>

  <!-- clock -->
  <rect x="368" y="12" width="22" height="22" fill="#1A2133"/><rect x="370" y="14" width="18" height="18" fill="#E8EAF0"/><rect x="378" y="17" width="2" height="8" fill="#171A21"/><rect x="378" y="23" width="6" height="2" fill="#F08A5D"/>

  <!-- door, with a light over it -->
  <rect x="418" y="2" width="14" height="5" fill="#12332F"/><rect x="420" y="3" width="10" height="3" fill="#6FE0D2"/>
  <rect x="404" y="8" width="42" height="48" fill="#0B0E13"/><rect x="406" y="10" width="38" height="46" fill="#4A5568"/><rect x="406" y="10" width="38" height="2" fill="#5E6A80"/>
  <rect x="412" y="16" width="26" height="16" fill="#1B2A44"/><rect x="414" y="18" width="6" height="4" fill="#7FB2FF"/><rect x="412" y="38" width="26" height="14" fill="#3D4759"/>
  <rect x="408" y="32" width="3" height="8" fill="#E8EAF0"/><rect x="402" y="56" width="46" height="3" fill="#7C8798"/>

  <!-- plant by the window -->
  <use href="#pd-plant" x="254" y="58" width="24" height="42"/>

  <!-- two rows of desks -->
  <use href="#pd-desk" x="120" y="112" width="72" height="42"/><rect x="144" y="115" width="24" height="15" fill="#12332F"/><rect x="147" y="118" width="15" height="3" fill="#6FE0D2"/><rect x="147" y="124" width="9" height="3" fill="#6FE0D2"/>
  <use href="#pd-desk" x="204" y="112" width="72" height="42"/><rect x="228" y="115" width="24" height="15" fill="#1B2A44"/><rect x="231" y="118" width="18" height="3" fill="#7FB2FF"/><rect x="231" y="124" width="12" height="3" fill="#7FB2FF"/>
  <use href="#pd-desk" x="288" y="112" width="72" height="42"/><rect x="312" y="115" width="24" height="15" fill="#2B1F33"/><rect x="315" y="118" width="12" height="3" fill="#C9A6FF"/><rect x="315" y="124" width="18" height="3" fill="#FF9A9A"/>
  <use href="#pd-desk" x="140" y="196" width="72" height="42"/><rect x="164" y="199" width="24" height="15" fill="#1B2A44"/><rect x="167" y="202" width="12" height="3" fill="#C9DEFF"/><rect x="167" y="208" width="18" height="3" fill="#7FB2FF"/>
  <use href="#pd-desk" x="224" y="196" width="72" height="42"/><rect x="248" y="199" width="24" height="15" fill="#12332F"/><rect x="251" y="202" width="18" height="3" fill="#6FE0D2"/><rect x="251" y="208" width="6" height="3" fill="#F8B366"/>

  <!-- bookshelf -->
  <svg x="14" y="132" width="54" height="48" viewBox="0 0 18 16"><rect width="18" height="16" fill="#7A4E30"/><rect x="1" y="1" width="16" height="6" fill="#171A21"/><rect x="1" y="8" width="16" height="7" fill="#171A21"/><rect x="2" y="2" width="2" height="5" fill="#F08A5D"/><rect x="5" y="3" width="2" height="4" fill="#7FB2FF"/><rect x="8" y="2" width="3" height="5" fill="#B9A6F2"/><rect x="13" y="3" width="2" height="4" fill="#6FE0D2"/><rect x="2" y="10" width="3" height="5" fill="#F8B366"/><rect x="6" y="9" width="2" height="6" fill="#C3C9D4"/><rect x="11" y="10" width="4" height="5" fill="#F08A5D"/></svg>

  <!-- sofa -->
  <svg x="14" y="222" width="90" height="36" viewBox="0 0 30 12"><rect y="2" width="3" height="8" fill="#5B4A8A"/><rect x="27" y="2" width="3" height="8" fill="#5B4A8A"/><rect x="3" width="24" height="6" fill="#6B59A3"/><rect x="3" y="6" width="24" height="4" fill="#8C76D6"/><rect x="2" y="10" width="2" height="2" fill="#3A2F5C"/><rect x="26" y="10" width="2" height="2" fill="#3A2F5C"/></svg>

  <!-- coffee corner -->
  <svg x="404" y="128" width="48" height="51" viewBox="0 0 16 17"><rect x="2" width="7" height="7" fill="#2F3848"/><rect x="3" y="1" width="5" height="2" fill="#0B0E13"/><rect x="3" y="1" width="1" height="1" fill="#FF9A9A"/><rect x="4" y="4" width="3" height="3" fill="#7A4E30"/><rect x="4" y="4" width="3" height="1" fill="#C3C9D4"/><rect x="11" y="5" width="2" height="2" fill="#F8B366"/><rect x="14" y="5" width="1" height="2" fill="#6FE0D2"/><rect y="7" width="16" height="2" fill="#E8EAF0"/><rect y="9" width="16" height="8" fill="#9AA3B2"/><rect y="9" width="16" height="1" fill="#C3C9D4"/><rect x="8" y="10" width="1" height="7" fill="#7C8798"/><rect x="6" y="12" width="1" height="2" fill="#4A5568"/><rect x="10" y="12" width="1" height="2" fill="#4A5568"/></svg>

  <!-- meeting table with chairs -->
  <svg x="340" y="242" width="90" height="36" viewBox="0 0 30 12"><rect x="4" width="5" height="3" fill="#4A5568"/><rect x="13" width="5" height="3" fill="#4A5568"/><rect x="22" width="5" height="3" fill="#4A5568"/><rect y="3" width="30" height="5" fill="#B5764A"/><rect y="3" width="30" height="1" fill="#D08C5C"/><rect y="8" width="30" height="1" fill="#7A4E30"/><rect x="2" y="9" width="2" height="3" fill="#7A4E30"/><rect x="26" y="9" width="2" height="3" fill="#7A4E30"/><rect x="12" y="4" width="5" height="3" fill="#2F3848"/><rect x="13" y="5" width="3" height="1" fill="#6FE0D2"/><rect x="21" y="5" width="4" height="2" fill="#E8EAF0"/><rect x="6" y="5" width="2" height="2" fill="#FF9A9A"/></svg>

  <!-- second plant -->
  <use href="#pd-plant" x="438" y="240" width="24" height="42"/>
</svg>
