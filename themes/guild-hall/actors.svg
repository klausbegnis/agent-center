<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Poses on a 16x20 grid (36x45 in the room). Fixed outline #2B1D1A; c1 body,
       c2 shade, c3 highlight, from "species.colors" in theme.json. -->
  <symbol id="rp-body" viewBox="0 0 16 20">
    <rect x="1" y="2" width="14" height="10" fill="#2B1D1A"/><rect x="1" y="11" width="14" height="5" fill="#2B1D1A"/>
    <rect x="3" y="16" width="4" height="3" fill="#2B1D1A"/><rect x="9" y="16" width="4" height="3" fill="#2B1D1A"/>
    <rect x="2" y="3" width="12" height="8" fill="var(--c1)"/><rect x="2" y="9" width="12" height="2" fill="var(--c2)"/>
    <rect x="3" y="4" width="3" height="1" fill="var(--c3)"/>
    <rect x="4" y="11" width="8" height="5" fill="var(--c1)"/><rect x="6" y="12" width="4" height="3" fill="#F7EAD0"/>
    <rect x="2" y="12" width="1" height="3" fill="var(--c1)"/><rect x="13" y="12" width="1" height="3" fill="var(--c1)"/>
    <rect x="4" y="17" width="2" height="1" fill="var(--c2)"/><rect x="10" y="17" width="2" height="1" fill="var(--c2)"/>
    <rect x="3" y="9" width="1" height="1" fill="#EE9C8E"/><rect x="12" y="9" width="1" height="1" fill="#EE9C8E"/>
  </symbol>
  <symbol id="rp-idle" viewBox="0 0 16 20">
    <use href="#rp-body"/>
    <rect x="4" y="6" width="2" height="3" fill="#2B1D1A"/><rect x="10" y="6" width="2" height="3" fill="#2B1D1A"/>
    <rect x="4" y="6" width="1" height="1" fill="#FFFFFF"/><rect x="10" y="6" width="1" height="1" fill="#FFFFFF"/>
    <rect x="7" y="9" width="2" height="1" fill="#2B1D1A"/>
  </symbol>
  <symbol id="rp-work" viewBox="0 0 16 20">
    <use href="#rp-body"/>
    <rect x="4" y="6" width="2" height="3" fill="#2B1D1A"/><rect x="10" y="6" width="2" height="3" fill="#2B1D1A"/>
    <rect x="4" y="6" width="1" height="1" fill="#FFFFFF"/><rect x="10" y="6" width="1" height="1" fill="#FFFFFF"/>
    <rect x="0" y="10" width="3" height="3" fill="#2B1D1A"/><rect x="13" y="10" width="3" height="3" fill="#2B1D1A"/>
    <rect x="1" y="11" width="1" height="1" fill="var(--c1)"/><rect x="14" y="11" width="1" height="1" fill="var(--c1)"/>
    <rect x="7" y="9" width="2" height="1" fill="#2B1D1A"/>
  </symbol>
  <symbol id="rp-read" viewBox="0 0 16 20">
    <use href="#rp-body"/>
    <rect x="4" y="7" width="2" height="1" fill="#2B1D1A"/><rect x="10" y="7" width="2" height="1" fill="#2B1D1A"/>
    <rect x="2" y="10" width="12" height="6" fill="#2B1D1A"/>
    <rect x="3" y="11" width="10" height="4" fill="#F6EDD3"/><rect x="7" y="11" width="2" height="4" fill="#D9CBA5"/>
    <rect x="4" y="12" width="2" height="1" fill="#A3916B"/><rect x="10" y="12" width="2" height="1" fill="#A3916B"/>
  </symbol>
  <symbol id="rp-wait" viewBox="0 0 16 20">
    <use href="#rp-body"/>
    <rect x="4" y="5" width="2" height="4" fill="#2B1D1A"/><rect x="10" y="5" width="2" height="4" fill="#2B1D1A"/>
    <rect x="4" y="5" width="1" height="1" fill="#FFFFFF"/><rect x="10" y="5" width="1" height="1" fill="#FFFFFF"/>
    <rect x="7" y="9" width="2" height="1" fill="#2B1D1A"/>
  </symbol>
  <symbol id="rp-blocked" viewBox="0 0 16 20">
    <use href="#rp-body"/>
    <rect x="4" y="7" width="2" height="1" fill="#2B1D1A"/><rect x="10" y="7" width="2" height="1" fill="#2B1D1A"/>
    <rect x="3" y="5" width="2" height="1" fill="#2B1D1A"/><rect x="11" y="5" width="2" height="1" fill="#2B1D1A"/>
    <rect x="6" y="9" width="4" height="1" fill="#2B1D1A"/>
  </symbol>
  <symbol id="rp-sleep" viewBox="0 0 16 20">
    <!-- Same body as the other poses, eyes closed, so outfits line up. -->
    <use href="#rp-body"/>
    <rect x="4" y="7" width="2" height="1" fill="#2B1D1A"/><rect x="10" y="7" width="2" height="1" fill="#2B1D1A"/>
  </symbol>
  <symbol id="rp-ears" viewBox="0 0 16 20">
    <rect x="2" y="0" width="4" height="3" fill="#2B1D1A"/><rect x="10" y="0" width="4" height="3" fill="#2B1D1A"/>
    <rect x="3" y="1" width="2" height="2" fill="var(--c1)"/><rect x="11" y="1" width="2" height="2" fill="var(--c1)"/>
  </symbol>
  <symbol id="rp-antenna" viewBox="0 0 16 20">
    <rect x="6" y="0" width="4" height="3" fill="#2B1D1A"/><rect x="7" y="1" width="2" height="2" fill="#E3B23C"/>
  </symbol>
  <!-- Outfits: one is picked per agent. o1 comes from "outfitColors" in theme.json. -->
  <symbol id="rp-out-scarf" viewBox="0 0 16 20">
    <rect x="2" y="10" width="12" height="3" fill="#2B1D1A"/><rect x="3" y="11" width="10" height="1" fill="var(--o1)"/><rect x="10" y="12" width="3" height="4" fill="#2B1D1A"/><rect x="11" y="12" width="1" height="3" fill="var(--o1)"/>
  </symbol>
  <symbol id="rp-out-cap" viewBox="0 0 16 20">
    <rect x="1" y="2" width="14" height="3" fill="#2B1D1A"/><rect x="2" y="3" width="12" height="1" fill="var(--o1)"/><rect x="12" y="4" width="4" height="2" fill="#2B1D1A"/><rect x="12" y="4" width="3" height="1" fill="var(--o1)"/>
  </symbol>
  <symbol id="rp-out-glasses" viewBox="0 0 16 20">
    <rect x="3" y="5" width="4" height="5" fill="none" stroke="#FFFFFF" stroke-width="1"/><rect x="9" y="5" width="4" height="5" fill="none" stroke="#FFFFFF" stroke-width="1"/><rect x="7" y="7" width="2" height="1" fill="#FFFFFF"/>
  </symbol>
  <symbol id="rp-out-bow" viewBox="0 0 16 20">
    <rect x="4" y="10" width="8" height="3" fill="#2B1D1A"/><rect x="5" y="11" width="2" height="1" fill="var(--o1)"/><rect x="9" y="11" width="2" height="1" fill="var(--o1)"/><rect x="7" y="11" width="2" height="1" fill="#FFFFFF"/>
  </symbol>
  <symbol id="rp-out-bandana" viewBox="0 0 16 20">
    <rect x="1" y="2" width="14" height="4" fill="#2B1D1A"/><rect x="2" y="3" width="12" height="2" fill="var(--o1)"/><rect x="4" y="3" width="1" height="1" fill="#FFFFFF"/><rect x="13" y="5" width="3" height="5" fill="#2B1D1A"/><rect x="14" y="5" width="1" height="4" fill="var(--o1)"/>
  </symbol>
  <!-- Emotes: short moves the plugin plays now and then, listed in "actors.emotes". A pose
       here stands in for the usual one while its emote plays; an effect is laid over the
       character and may reach outside the grid. -->
  <!-- Arms up, eyes shut, mouth wide: the quest is done. -->
  <symbol id="rp-cheer" viewBox="0 0 16 20">
    <use href="#rp-body"/>
    <rect x="4" y="7" width="2" height="1" fill="#2B1D1A"/><rect x="10" y="7" width="2" height="1" fill="#2B1D1A"/>
    <rect x="7" y="8" width="2" height="2" fill="#2B1D1A"/><rect x="7" y="9" width="2" height="1" fill="#EE9C8E"/>
    <rect x="0" y="6" width="3" height="7" fill="#2B1D1A"/><rect x="1" y="7" width="1" height="5" fill="var(--c1)"/>
    <rect x="13" y="6" width="3" height="7" fill="#2B1D1A"/><rect x="14" y="7" width="1" height="5" fill="var(--c1)"/>
  </symbol>
  <!-- Stars, for a job seen through. -->
  <symbol id="rp-fx-stars" viewBox="0 0 16 20" overflow="visible">
    <rect x="-3" y="2" width="1" height="3" fill="#E3B23C"/><rect x="-4" y="3" width="3" height="1" fill="#E3B23C"/><rect x="-3" y="3" width="1" height="1" fill="#FFFFFF"/><rect x="18" y="10" width="1" height="3" fill="#E3B23C"/><rect x="17" y="11" width="3" height="1" fill="#E3B23C"/><rect x="18" y="11" width="1" height="1" fill="#FFFFFF"/><rect x="1" y="-2" width="1" height="1" fill="#FFFFFF"/><rect x="-3" y="12" width="1" height="1" fill="#E3B23C"/><rect x="17" y="16" width="1" height="1" fill="#FFFFFF"/><rect x="5" y="-3" width="1" height="1" fill="#E3B23C"/>
  </symbol>
  <!-- Light streaming up either side: a second wind. -->
  <symbol id="rp-fx-shine" viewBox="0 0 16 20" overflow="visible">
    <rect x="-2" y="8" width="1" height="5" fill="#FFFFFF"/><rect x="-3" y="13" width="1" height="3" fill="var(--c3)"/><rect x="-1" y="15" width="1" height="3" fill="var(--c3)"/><rect x="17" y="6" width="1" height="5" fill="#FFFFFF"/><rect x="18" y="12" width="1" height="3" fill="var(--c3)"/><rect x="16" y="14" width="1" height="4" fill="var(--c3)"/><rect x="-2" y="2" width="1" height="3" fill="#FFFFFF"/><rect x="-3" y="3" width="3" height="1" fill="#FFFFFF"/>
  </symbol>
  <!-- A lamp switching on: an idea. -->
  <symbol id="rp-fx-idea" viewBox="0 0 16 20" overflow="visible">
    <rect x="-4" y="-4" width="5" height="5" fill="#2B1D1A"/><rect x="-3" y="1" width="3" height="2" fill="#2B1D1A"/><rect x="-3" y="-3" width="3" height="3" fill="#E3B23C"/><rect x="-3" y="-3" width="1" height="1" fill="#FFFFFF"/><rect x="-2" y="1" width="1" height="1" fill="#FFFFFF"/><rect x="-6" y="-2" width="1" height="1" fill="#E3B23C"/><rect x="-2" y="-6" width="1" height="1" fill="#E3B23C"/><rect x="2" y="-5" width="1" height="1" fill="#E3B23C"/>
  </symbol>
  <!-- Steam let off in a stomp. -->
  <symbol id="rp-fx-steam" viewBox="0 0 16 20" overflow="visible">
    <rect x="-3" y="1" width="4" height="4" fill="#2B1D1A"/><rect x="-2" y="2" width="2" height="2" fill="#FFFFFF"/><rect x="-5" y="-3" width="3" height="3" fill="#2B1D1A"/><rect x="-4" y="-2" width="1" height="1" fill="#FFFFFF"/><rect x="-1" y="-4" width="3" height="3" fill="#2B1D1A"/><rect x="0" y="-3" width="1" height="1" fill="#FFFFFF"/>
  </symbol>
  <!-- Familiar: a round squire with a plume, one per subagent, in its parent's colours. The
       plume takes the parent's outfit colour. -->
  <symbol id="rp-familiar" viewBox="0 0 10 10">
    <rect x="3" y="0" width="4" height="2" fill="#2B1D1A"/><rect x="6" y="1" width="2" height="2" fill="#2B1D1A"/><rect x="4" y="0" width="2" height="1" fill="var(--o1, #6FA85B)"/><rect x="6" y="1" width="1" height="1" fill="var(--o1, #6FA85B)"/>
    <rect x="1" y="2" width="8" height="7" fill="#2B1D1A"/><rect x="0" y="3" width="10" height="5" fill="#2B1D1A"/>
    <rect x="1" y="9" width="3" height="1" fill="#2B1D1A"/><rect x="6" y="9" width="3" height="1" fill="#2B1D1A"/>
    <rect x="1" y="3" width="8" height="5" fill="var(--c1)"/><rect x="1" y="7" width="8" height="1" fill="var(--c2)"/>
    <rect x="2" y="3" width="2" height="1" fill="var(--c3)"/>
    <rect x="2" y="5" width="2" height="2" fill="#2B1D1A"/><rect x="6" y="5" width="2" height="2" fill="#2B1D1A"/>
    <rect x="2" y="5" width="1" height="1" fill="#FFFFFF"/><rect x="6" y="5" width="1" height="1" fill="#FFFFFF"/>
    <rect x="4" y="7" width="2" height="1" fill="#F7EAD0"/>
  </symbol>
</svg>
